/* ===== Landing (scroll panjang) ===== */
#ld{position:relative;z-index:40;color:var(--tx);font-family:system-ui,"Arial Black",sans-serif;background:transparent;overflow-x:clip}
#smooth-wrapper,#smooth-content{width:100%}

.ld-n{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1100px;margin:0 auto;padding:18px 20px}
.ld-n b{font:italic 700 24px Georgia,serif;letter-spacing:.06em}
.ld-n button{font:600 13px system-ui;color:inherit;padding:8px 18px;border:1px solid var(--bd);border-radius:999px;background:none;cursor:pointer;transition:.2s}

.ld-main{position:absolute;inset:0;z-index:0;pointer-events:none}

.ld-s.r{align-items:flex-end;text-align:right}.ld-s.r .ld-d{margin-left:auto}
.ld-s.c{align-items:center;text-align:center}.ld-s.c .ld-d{margin-inline:auto}
.ld-h{margin:0;font:900 clamp(52px,17vw,220px)/.9 system-ui,"Arial Black",Impact,sans-serif;letter-spacing:-.04em;text-align:center;text-transform:uppercase;white-space:nowrap}
.ld-h span{display:inline-block;cursor:default;transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .25s,text-shadow .25s}
.ld-h span:hover{transform:translateY(-.14em) rotate(-7deg) scale(1.1);color:#c4b5fd;text-shadow:.04em .05em 0 #4338ca}
.ld-sub{margin:4vh 0 0;font:600 clamp(18px,2.6vw,28px)/1.3 system-ui,sans-serif;color:var(--mu);perspective:500px}
.ld-cue{margin-top:6vh;font:600 12px ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--mu)}
.ld-k{margin-bottom:18px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#c4b5fd}
.ld-t{margin:0;font:800 clamp(34px,7vw,92px)/1.08 system-ui,sans-serif;letter-spacing:-.03em;perspective:500px}
.ld-d{max-width:560px;margin:22px 0 0;font:500 clamp(16px,1.8vw,19px)/1.65 system-ui,sans-serif;color:var(--mu)}
#ld.fx .ld-t,#ld.fx .ld-d,#ld.fx .ld-k,#ld.fx .ld-sub{opacity:0}
.ld-go{margin-top:34px;padding:16px 34px;border:0;border-radius:999px;background:#c4b5fd;color:#14102e;font:700 18px system-ui;cursor:pointer;transition:transform .25s}.ld-go:hover{transform:scale(1.06) rotate(-2deg)}
.ld-bd{position:absolute;right:2%;top:62%;width:clamp(96px,14vw,150px);aspect-ratio:1;border:0;border-radius:50%;background:#c4b5fd;color:#14102e;cursor:pointer;display:grid;place-items:center;transition:transform .25s}
.ld-bd:hover{transform:scale(1.08) rotate(-6deg)}
.ld-bd svg{position:absolute;inset:0;width:100%;animation:sp 14s linear infinite}
.ld-bd text{font:700 15px system-ui;letter-spacing:2px;fill:#14102e}
@keyframes sp{to{transform:rotate(360deg)}}
.ld-bd b{font-size:28px}
.pc{position:absolute;width:140px;height:140px;display:flex;justify-content:center;align-items:center}
.pc.p1{right:6%;top:4%}.pc.p2{left:4%;top:22%}.pc.p3{right:4%;top:42%}.pc.p4{left:4%;top:62%}.pc.p5{right:4%;top:78%}.pc.p6{left:6%;top:94%}
.pm{width:100px;height:100px}
.pbox{width:100px;height:100px;box-sizing:border-box;border:3px solid #c4b5fd;border-radius:50%;background:transparent;box-shadow:0 0 18px rgba(196,181,253,.45);opacity:0;will-change:transform}
#ld.cube .pbox{opacity:1}
.pfinal{height:20vh}
.pv{width:min(580px,100%);margin:34px auto 0;border-radius:20px;background:var(--card);border:1px solid var(--bd);overflow:hidden;box-shadow:0 30px 70px -30px #000;text-align:left;font-family:system-ui,sans-serif;color:var(--tx)}

.pvs>div{position:absolute;inset:0;padding:20px 22px;opacity:0}
.pvs>div.sc1{opacity:1}
.pvh{margin-bottom:12px;font:600 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#c4b5fd}
.pvg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pvk{padding:14px;border-radius:14px;border:1px solid var(--bd);background:rgba(255,255,255,.05);font:600 14px/1.3 system-ui}
.pvk b{display:block;margin-bottom:6px;font:500 11px ui-monospace,monospace;color:var(--mu)}
.pvq{margin-bottom:12px;font:700 17px/1.3 system-ui}
.pvo{margin-top:8px;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);font:600 14px system-ui}
.pve{margin-top:12px;font-size:13px;color:#4ade80}
.pvu{max-width:75%;margin-left:auto;padding:10px 14px;border-radius:16px;background:#c4b5fd;color:#14102e;font:600 14px system-ui}
.pva{position:relative;max-width:85%;margin-top:12px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.08);font:500 14px/1.5 system-ui}
.pvt{display:block}
.pvd{position:absolute;left:14px;top:14px;display:flex;gap:4px}
.pvd i{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:wv 1s infinite}
.pvd i:nth-child(2){animation-delay:.15s}.pvd i:nth-child(3){animation-delay:.3s}
.sc4 svg{width:100%;height:auto}
.pvc{fill:none;stroke:#c4b5fd;stroke-width:3.5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.pvp{fill:#c4b5fd}.pvx{stroke:var(--bd);stroke-width:1}
@media(max-width:700px){.pc{width:110px;height:110px}.pbox,.pm{width:76px;height:76px}.ld-bd{top:auto;bottom:2%}}
/* ===== Chat AI di Home ===== */
#cw.home{position:static;display:block!important;width:auto;height:auto;max-height:none;margin:22px 0 28px;padding:30px 22px 22px;transform:none;opacity:1;pointer-events:all;overflow:visible;border:1px solid rgba(255,255,255,.1);border-radius:26px;color:#f6eedc;background:radial-gradient(ellipse at 50% 0,rgba(168,85,247,.16),transparent 65%),rgba(8,9,18,.8);box-shadow:0 24px 60px -30px #000}

.ah p{margin:8px 0 0;color:#8e93a8;font-size:15px}

/* ===== Kurva progres ===== */
.curve svg{width:100%;height:auto;margin:10px 0 26px}
.gl{stroke:var(--bd)}.gt{fill:var(--mu);font-size:11px}.ga{fill:var(--ac);opacity:.12}
.gc{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.4s ease forwards}
.gd{fill:var(--bg);stroke:var(--ac);stroke-width:2}
@keyframes dr{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.gc{stroke-dashoffset:0}}
/* ===== Optimasi ===== */
.paused *{animation-play-state:paused!important}

/* ===== Home panjang ===== */
.hs{margin:78px 0 0}
.hs-t{margin:0 0 14px;font:800 clamp(28px,6vw,44px)/1.1 system-ui,sans-serif;letter-spacing:-.025em;perspective:500px}
.hs>p{max-width:60ch;margin:0 0 18px}
.stp{display:grid;gap:12px;counter-reset:s}

.faq details{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::after{content:"+";font-size:20px;line-height:1;color:var(--mu);transition:transform .25s}.faq details[open] summary::after{transform:rotate(45deg)}

#cm2,#cw #ci,#cw .ab textarea{scrollbar-width:none;-ms-overflow-style:none}#cm2::-webkit-scrollbar,#cw #ci::-webkit-scrollbar,#cw .ab textarea::-webkit-scrollbar{display:none;width:0;height:0}

<script>
// Format: [soal, [pilihan], indeks jawaban benar (0=A), penjelasan]
const Q0=[
["Which field studies how speech sounds are produced?",["Phonology","Phonetics","Semantics","Syntax"],1,"Phonetics studies speech sounds, including how the mouth, tongue, and lips produce them."],
["Which branch studies the movement of the tongue and lips?",["Acoustic phonetics","Auditory phonetics","Articulatory phonetics","Phonology"],2,"Articulatory phonetics is about the movement of the speech organs, e.g. the tongue moving for /t/."],
["Which branch studies sound waves?",["Acoustic phonetics","Articulatory phonetics","Auditory phonetics","Morphology"],0,"Acoustic phonetics studies sound as waves, e.g. frequency and amplitude."],
["Which branch focuses on how people hear speech sounds?",["Phonology","Acoustic phonetics","Articulatory phonetics","Auditory phonetics"],3,"Auditory phonetics is about hearing: how the ear receives and processes sounds."],
["Which sound is produced using both lips?",["/f/","/m/","/θ/","/t/"],1,"Bilabial means both lips, as in /p/, /b/, and /m/."],
["Which consonant is produced at the alveolar ridge?",["/t/","/f/","/k/","/m/"],0,"The alveolar ridge is just behind the upper teeth. /t/ is made with the tongue tip touching it."],
["What is a fricative consonant?",["A sound with complete airflow blockage","A sound produced through the nose only","A sound produced by forcing air through a narrow passage","A sound without airflow"],2,"A fricative is made by forcing air through a narrow gap, as in /f/, /s/, and /v/."],
["Which consonant is voiced?",["/s/","/θ/","/v/","/ʃ/"],2,"Voiced means the vocal folds vibrate. Say /v/ with a hand on your throat and you will feel it."],

["How is the consonant /b/ classified?",["Voiceless bilabial plosive","Voiced bilabial plosive","Voiced alveolar nasal","Voiceless labiodental fricative"],1,"Voiced = vocal folds vibrate. Bilabial = both lips. Plosive = airflow blocked, then released. /b/ has all three."],
["The sound /n/ is classified as a _____.",["Voiceless alveolar plosive","Voiced bilabial nasal","Voiced velar nasal","Voiced alveolar nasal"],3,"/n/ is voiced (vocal folds vibrate), alveolar (tongue at the ridge behind the upper teeth), and nasal (air leaves through the nose)."],
["Which description correctly identifies /ʃ/ in the word “shoe”?",["Voiceless postalveolar fricative","Voiced alveolar fricative","Voiceless bilabial plosive","Voiced dental fricative"],0,"/ʃ/ is the “sh” in shoe. It is voiceless (no vibration) and a fricative."],
["Which acoustic property is associated with sound intensity?",["Frequency","Duration","Amplitude","Place of articulation"],2,"Amplitude relates to how loud or soft a sound is. Greater amplitude usually sounds louder."],
["Which feature measures how long a sound lasts?",["Pitch","Duration","Voicing","Frequency"],1,"Duration is how long a sound lasts."],
["Which unit is used to measure frequency?",["Decibel (dB)","Second (s)","Hertz (Hz)","Meter (m)"],2,"Frequency is measured in Hertz. Remember: Hz = frequency, dB = intensity, seconds = duration."],
["If a sound has a higher frequency, it generally has _____.",["Lower pitch","Higher pitch","Longer duration","Lower intensity"],1,"Frequency relates to pitch. When frequency rises, pitch usually sounds higher."],
["Two sounds have similar frequencies, but one has greater amplitude. What is the difference?",["The sound has more syllables","The sound has a different spelling","The sound has greater intensity","The sound has a different meaning"],2,"Amplitude relates to strength. Greater amplitude usually means a louder sound."],
["Two speakers pronounce “water” differently because of their regional backgrounds. This is called _____.",["Morphology","Accent variation","Sentence structure","Word formation"],1,"Accent variation is a difference in pronunciation due to a speaker’s region or background."],
["A listener can understand the words spoken by someone with a strong accent. This demonstrates _____.",["Grammar accuracy","Vocabulary complexity","Intelligibility","Word stress"],2,"Intelligibility is whether a listener can understand what is said."],
["A listener understands a speaker but needs considerable effort. This describes _____.",["Comprehensibility","Morphology","Orthography","Frequency"],0,"Comprehensibility is how easy or difficult speech is to understand."],
["Which statement about pronunciation variation is correct?",["All speakers must sound identical","Different accents always mean incorrect English","Pronunciation can vary across regions without necessarily being incorrect","English has only one pronunciation"],2,"Every region can have a different accent. Everyone does not have to sound British or American."],
["Which sound is found at the beginning of the word “think”?",["/ð/","/θ/","/s/","/t/"],1,"/θ/ is a voiceless dental fricative. Place the tongue tip lightly between the teeth."],
["Which description correctly identifies /ð/ in the word “this”?",["Voiceless dental fricative","Voiced alveolar plosive","Voiced dental fricative","Voiceless bilabial plosive"],2,"/ð/ sounds like “th” but is voiced, as in this, those, and they."],
["An Indonesian learner pronounces “think” as “sink”. Which sound substitution occurs?",["/θ/ is replaced by /s/","/s/ is replaced by /θ/","/k/ is replaced by /g/","/ɪ/ is replaced by /iː/"],0,"Think should begin with /θ/, but the learner says /s/. So /θ/ is replaced by /s/."],
["A student has difficulty distinguishing “rice” and “lice”. Which phonemes are involved?",["/s/ and /z/","/r/ and /l/","/p/ and /b/","/f/ and /v/"],1,"Rice begins with /r/ and lice with /l/. The difference is in the initial sound."],
["Which word begins with a three-consonant cluster?",["Play","Green","Spring","Train"],2,"Spring begins with /spr/: three consonants in a row, /s/, /p/, and /r/."],
["A learner pronounces “cold” without its final /d/. What is the problem?",["Incorrect word stress","Vowel substitution","Initial consonant deletion","Final consonant deletion"],3,"Final means at the end and deletion means removal, so the /d/ at the end of the word is dropped."],
["The noun REcord and the verb reCORD demonstrate _____.",["Word stress can distinguish grammatical categories","English words never change stress","Stress affects only spelling","All words have the same stress"],0,"REcord (noun) and reCORD (verb): the stress moves to a different syllable. This is stress shift."],
["Which pair is a minimal pair?",["House – Garden","English – Language","Coat – Goat","Happy – Beautiful"],2,"A minimal pair is two words that differ in only one phoneme and have different meanings. Coat and goat differ in the initial sound."],
["The words “cap” and “cab” differ in which phonemes?",["/k/ and /g/","/æ/ and /e/","/t/ and /d/","/p/ and /b/"],3,"Cap ends in /p/ and cab in /b/. /p/ is voiceless and /b/ is voiced."],
["Which pair demonstrates the difference between /ɪ/ and /iː/?",["Fan – Van","Ship – Sheep","Think – Sink","Coat – Goat"],1,"Ship = /ʃɪp/ and sheep = /ʃiːp/. They differ in the vowel: /ɪ/ is shorter, /iː/ is longer and has a different quality."],
["Which notation is used for detailed phonetic transcription?",["/ /","( )","[ ]"],2,"[ ] = phonetic transcription (shows detail). / / = phonemic transcription (shows phonemes)."],
["Which statement about phonemic transcription is correct?",["It represents every small phonetic detail","It uses ordinary spelling only","It represents phonemes and uses slashes","It is only used for grammar"],2,"Phonemic transcription shows sounds that can distinguish meaning and is written between slashes / /."],
["Which is the correct British English transcription of “dog”?",["/dʌg/","/dʊg/","/dæg/","/dɒg/"],3,"In the Standard British English used in the material, dog is /dɒg/. The symbol /ɒ/ is the vowel."],

["In the words “pin” and “spin”, /p/ is pronounced differently. These sounds are examples of _____.",["Two different phonemes","Different vowel sounds","Allophones of the same phoneme","Different syllable types"],2,"The /p/ in pin is usually aspirated [pʰ] (a stronger puff of air); in spin it is not. They are variants of the same phoneme /p/."],

function initSmooth(){
  if(!(window.gsap&&window.ScrollTrigger&&window.ScrollSmoother))return;
  if(!matchMedia("(min-width:861px) and (hover:hover) and (pointer:fine)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  gsap.registerPlugin(ScrollTrigger,ScrollSmoother);
  SM=ScrollSmoother.create({wrapper:"#smooth-wrapper",content:"#smooth-content",smooth:1.2,effects:true});
  let t;new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(()=>ScrollTrigger.refresh(),150)}).observe(document.getElementById("smooth-content"));
}
function toTop(){if(SM)SM.scrollTop(0);else window.scrollTo(0,0)}

function curveSvg(v){
  if(v.length<2)return "<p>Take at least two quizzes to see your curve.</p>";
  const W=600,H=220,P=28,x=i=>P+i*(W-2*P)/(v.length-1),y=p=>H-P-p/100*(H-2*P),q=v.map((p,i)=>[x(i),y(p)]);
  let d="M"+q[0][0]+" "+q[0][1];
  for(let i=0;i<q.length-1;i++){const a=q[i-1]||q[i],b=q[i],c=q[i+1],e=q[i+2]||c;d+=` C${b[0]+(c[0]-a[0])/6} ${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6} ${c[1]-(e[1]-b[1])/6} ${c[0]} ${c[1]}`}
  const l=q[q.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Quiz score curve">`+[0,50,100].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(g)}" y2="${y(g)}" class="gl"/><text x="2" y="${y(g)+4}" class="gt">${g}</text>`).join("")+`<path d="${d} L${l[0]} ${H-P} L${q[0][0]} ${H-P}Z" class="ga"/><path d="${d}" class="gc" pathLength="1"/>`+q.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" class="gd"/>`).join("")+"</svg>";
}

function pick(k){

function errMsg(s,j){
  const m=(j&&j.error&&j.error.message)||"";
  if(s===400||s===401||s===403)return "Google rejected this key. Make sure it is copied in full and the Gemini API is enabled for it.";
  if(s===429)return "Usage limit reached for this key. Wait a moment, or try another key.";
  if(s>=500)return "Google's servers are busy. Try again in a moment.";
  return m||("Error "+s);
}
async function testKey(k){
  try{
    const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=1",{headers:{"x-goog-api-key":k}});
    if(r.ok)return true;
    return errMsg(r.status,await r.json().catch(()=>({})));
  }catch(e){return "Network error. Check your connection and try again."}
}
async function saveKey(){

  bub("a","Hi! I’m your Lingora tutor. Ask me about any topic, exercise, or quiz question.");
  chat.forEach(m=>bub(m.role==="user"?"u":"a",m.role==="user"?esc(m.parts[0].text):fmt(m.parts[0].text)));
  $("ci").onkeydown=e=>{e.stopPropagation();if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask($("ci").value)}};$("cr").onclick=()=>{chat.length=0;renderChat()};$("cg").onclick=()=>renderChat(true);
  $("cs").onclick=()=>ask($("ci").value);
  document.querySelectorAll(".qc .chip").forEach(b=>b.onclick=()=>ask(b.textContent));

const MAX_TURNS=8;
async function ask(q){
  q=(q||"").trim();
  if(!q||thinking)return;
  const key=ST.get("lg-key");
  if(!key){renderChat(true);return}
  thinking=true;
  bub("u",esc(q));
  chat.push({role:"user",parts:[{text:q}]});
  const ci=$("ci");if(ci)ci.value="";
  const el=bub("a",'<span class="dots"><i></i><i></i><i></i></span>');
  const sys="You are Lingora’s AI tutor for semester 3 English Education students. Reply in clear English, in under 170 words unless asked for more, with short examples. The student is currently studying: "+(ctx||"the Lingora home page")+".";
  const turns=chat.slice(-MAX_TURNS);
  while(turns.length&&turns[0].role!=="user")turns.shift();
  const scroll=()=>{const cm=$("cm2");if(cm)cm.scrollTop=1e9};
  let out="",err="";
  try{
    for(const {m,cfg} of MODELS){
      try{
        const body=JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:turns,generationConfig:Object.assign({maxOutputTokens:600,temperature:.7},cfg)});
        const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":streamGenerateContent?alt=sse",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body});
        if(!r.ok){
          const j=await r.json().catch(()=>({}));
          err=errMsg(r.status,j);
          if([404,429,500,503].includes(r.status))continue;
          break;
        }
        // stream: show text as it arrives
        const reader=r.body.getReader(),dec=new TextDecoder();
        let buf="";
        out="";
        while(true){
          const {done,value}=await reader.read();
          if(done)break;
          buf+=dec.decode(value,{stream:true});
          let idx;
          while((idx=buf.indexOf("\n"))>=0){
            const line=buf.slice(0,idx).trim();buf=buf.slice(idx+1);
            if(!line.startsWith("data:"))continue;
            try{
              const j=JSON.parse(line.slice(5));
              const c=(j.candidates||[])[0]||{};
              const t=((c.content&&c.content.parts)||[]).map(p=>p.text||"").join("");
              if(t){out+=t;el.innerHTML=fmt(out);scroll()}
              if(c.finishReason&&!out)err="The reply was blocked ("+c.finishReason.toLowerCase().replace(/_/g," ")+"). Try rephrasing.";
            }catch(e){}
          }
        }
        if(out.trim()){out=out.trim();break}
        err=err||"The model returned an empty reply.";
        break;
      }catch(e){err="Network error. Check your connection.";break}
    }
  }finally{
    if(out){chat.push({role:"model",parts:[{text:out}]});el.innerHTML=fmt(out)}
    else{
      chat.pop();
      el.classList.add("err");
      el.innerHTML=esc(err||"No response from the model.")+"<br><small>Check your key with the ⚙ button, then try again.</small>";
      const c2=$("ci");if(c2)c2.value=q;
    }
    thinking=false;scroll();
  }
}

function ldPath(l){
  if(!(window.gsap&&window.ScrollTrigger&&window.MotionPathPlugin))return null;

  const build=()=>{
    cx&&cx.revert();

      const box=l.querySelector(".pbox"),r0=box.getBoundingClientRect();
      const points=gsap.utils.toArray(l.querySelectorAll(".pc:not(.p1) .pm")).map(m=>{
        const r=m.getBoundingClientRect();
        return{x:r.left+r.width/2-(r0.left+r0.width/2),y:r.top+r.height/2-(r0.top+r0.height/2)};
      });
      gsap.timeline({scrollTrigger:{trigger:l.querySelector(".pc.p1"),start:"clamp(top center)",endTrigger:l.querySelector(".pfinal"),end:"clamp(top center)",scrub:1}})
        .to(box,{duration:1,ease:"none",motionPath:{path:points,curviness:1.5}},0);
    },l);
  };
  build();
  const rs=()=>{clearTimeout(t);t=setTimeout(build,200)};addEventListener("resize",rs);
